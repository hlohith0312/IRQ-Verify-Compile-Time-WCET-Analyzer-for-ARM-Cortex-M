[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irq-verify"
version = "1.0.0"
description = "Production-grade cycle-exact WCET analyzer for ARM Cortex-M interrupt handlers with VS Code integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    {name = "irq-verify contributors"}
]
keywords = ["embedded", "arm", "cortex-m", "wcet", "real-time", "safety-critical", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pycparser>=2.21",
    "pcpp>=1.30",
    "pyelftools>=0.31",
    "capstone>=5.0.1",
    "pygls>=1.3.0",
]

[project.scripts]
irq-verify = "irq_verify.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["irq_verify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
